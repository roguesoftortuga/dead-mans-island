<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dead Man's Island — PvP ARK: Survival Ascended</title>
<meta name="description" content="Dead Man's Island — PvP ARK: Survival Ascended. 2X XP, 3X Harvest, 5X Tame, 10X Breeding, No Transfers, No Mods, No Wipes, Active Admin.">
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; background:#000; }
  body { overflow-x:hidden; }
  .page {
    position:relative;
    width:100%;
    max-width:1672px;
    margin:0 auto;
    line-height:0;
  }
  .page img {
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }
  .hotspot {
    position:absolute;
    display:block;
    background:transparent;
    cursor:pointer;
    line-height:normal;
    z-index:2;
    border-radius:4px;
  }
  .hotspot:focus-visible {
    outline:2px solid #fff;
    outline-offset:2px;
  }
  .sr-only {
    position:absolute;
    width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  /* Coordinates are percentages of the 1672 x 941 reference image.
     This keeps the visual pixel-for-pixel while still scaling responsively. */
  .nav-server { left:15.0%; top:1.0%; width:6.0%; height:4.5%; }
  .nav-rules { left:19.2%; top:1.0%; width:5.0%; height:4.5%; }
  .nav-rates { left:25.6%; top:1.0%; width:5.0%; height:4.5%; }
  .nav-settings { left:31.1%; top:1.0%; width:6.2%; height:4.5%; }
  .nav-discord { left:38.2%; top:1.0%; width:6.0%; height:4.5%; }

  .hero-discord { left:72.3%; top:51.0%; width:19.5%; height:7.8%; }
  .view-server { left:5.8%; top:85.0%; width:12.7%; height:5.0%; }
  .join-island { left:60.4%; top:85.0%; width:15.5%; height:5.0%; }

  .bottom-discord { left:0; right:0; top:94.0%; height:6.0%; }
  @media (max-width:700px) {
    .page { min-width:0; }
    .hotspot { min-width:34px; }
  }
</style>
</head>
<body>
<main class="page" aria-label="Dead Man's Island server website">
  <img src="assets/dead-mans-island-page.png"
       alt="Dead Man's Island PvP ARK: Survival Ascended server website."
       width="1672" height="941">

  <a class="hotspot nav-server" href="#server"><span class="sr-only">Server</span></a>
  <a class="hotspot nav-rules" href="#rules"><span class="sr-only">Rules</span></a>
  <a class="hotspot nav-rates" href="#rates"><span class="sr-only">Rates</span></a>
  <a class="hotspot nav-settings" href="#settings"><span class="sr-only">Settings</span></a>
  <a class="hotspot nav-discord" href="https://discord.gg/VFyjA7eXP" target="_blank" rel="noopener"><span class="sr-only">Discord</span></a>

  <a class="hotspot hero-discord" href="https://discord.gg/VFyjA7eXP" target="_blank" rel="noopener"><span class="sr-only">Join Discord</span></a>
  <a class="hotspot view-server" href="#server"><span class="sr-only">View server info</span></a>
  <a class="hotspot join-island" href="https://discord.gg/VFyjA7eXP" target="_blank" rel="noopener"><span class="sr-only">Join the island</span></a>

  <a class="hotspot bottom-discord" href="https://discord.gg/VFyjA7eXP" target="_blank" rel="noopener"><span class="sr-only">Discord</span></a>

  <span id="server" class="sr-only">Server information</span>
  <span id="rules" class="sr-only">Rules</span>
  <span id="rates" class="sr-only">Rates</span>
  <span id="settings" class="sr-only">Settings</span>
</main>
</body>
</html>
